workflows:
  ios-workflow:
    name: Build Egg3D IPA
    instance_type: mac_mini_m2
    scripts:
      - name: Build Unsigned IPA
        script: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "Egg3D" "com.gadenysh.egg3d" --web-dir=www
          npx cap add ios
          npx cap sync ios
          cd ios/App && pod install && cd ../..
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=$PWD/build
          mkdir -p Payload
          cp -r build/App.app Payload/
          zip -qry Egg3D.ipa Payload
    artifacts:
      - Egg3D.ipa
